server:
  port: 8091
spring:
  application:
    name: genai-assistant
  datasource:
    url: ${ASSISTANT_DB_URL:jdbc:postgresql://localhost:5432/assistant}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
assistant:
  model: ${ASSISTANT_MODEL:claude-opus-5-5}
  max-tokens: 16000
  effort: ${ASSISTANT_EFFORT:medium}
  max-tool-iterations: 8
  retrieval-top-k: 4
  pos-api-url: ${POS_API_URL:http://localhost:8080}
  vector-store: ${ASSISTANT_VECTOR_STORE:pgvector}
  embeddings: ${ASSISTANT_EMBEDDINGS:transformers}
management:
  endpoints.web.exposure.include: health,info
