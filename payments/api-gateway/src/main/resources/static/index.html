<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Terminal</title>
<style>
  :root {
    --bg: #f5f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
    --accent: #1f6f5c; --accent-ink: #ffffff; --warn: #a3402b; --chip: #eef3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1f201e; --ink: #ecebe6; --muted: #9a9a93; --line: #33342f;
            --accent: #4fb397; --accent-ink: #0d1411; --warn: #e07a62; --chip: #24302c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  input, select, button, textarea { font: inherit; color: inherit; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .product { text-align: left; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .product small { color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0; }
  .row + .row { border-top: 1px dashed var(--line); }
  .qty { display: flex; gap: 4px; align-items: center; }
  .qty button { padding: 0 8px; }
  .totals .row { border: 0; padding: 2px 0; }
  .total { font-size: 18px; font-weight: 700; }
  .muted { color: var(--muted); }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
  .msg { margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--chip); white-space: pre-wrap; }
  .msg.error { color: var(--warn); }
  pre.receipt { font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); padding: 8px; overflow-x: auto; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .inline { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chat { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .bubble { padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  .bubble.me { background: var(--chip); align-self: flex-end; max-width: 90%; }
  .bubble.bot { border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 2px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>POS Terminal</h1>
  <label>Store <select id="store"><option>store-001</option><option>store-002</option></select></label>
  <label>Terminal <input id="terminal" value="till-01" size="8"></label>
  <label>Loyalty id <input id="customer" placeholder="optional" size="10"></label>
  <button id="newCart">New sale</button>
  <span id="cartInfo" class="muted"></span>
</header>
<main>
  <section>
    <h2>Products</h2>
    <input id="search" placeholder="Search products" style="width:100%;margin-bottom:8px">
    <div id="products" class="grid"></div>
  </section>

  <section class="stack">
    <div>
      <h2>Basket</h2>
      <div id="lines"><p class="muted">Basket is empty.</p></div>
      <div id="recs"></div>
      <div class="totals" id="totals"></div>
    </div>
    <div>
      <h2>Tender</h2>
      <div class="inline">
        <select id="method">
          <option value="CARD">Card</option>
          <option value="CASH">Cash</option>
        </select>
        <select id="token" title="Simulated card">
          <option value="tok_visa">Visa (approves)</option>
          <option value="tok_mastercard">Mastercard (approves)</option>
          <option value="tok_decline">Card (declines)</option>
          <option value="tok_expired">Expired card</option>
          <option value="tok_limit_2000">Card with $20 limit</option>
        </select>
        <input id="tendered" type="number" step="0.01" min="0" placeholder="Cash $" style="width:90px;display:none">
        <button id="pay" class="primary" disabled>Charge</button>
      </div>
      <div id="payMsg"></div>
      <pre id="receipt" class="receipt" style="display:none"></pre>
    </div>
  </section>

  <section class="stack">
    <div>
      <h2>Assistant</h2>
      <div id="chat" class="chat"></div>
      <form id="ask" class="inline" style="margin-top:8px">
        <input id="question" placeholder="e.g. Why was the last sale declined?" style="flex:1">
        <button class="primary">Ask</button>
      </form>
    </div>
    <div>
      <h2>Recent transactions</h2>
      <table id="recent"></table>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));

let cart = null, quote = null, products = [], conversationId = null;
let pendingKey = null; // reused if the charge must be retried, so a retry can never double-charge

async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers: {'Content-Type': 'application/json', ...(opts.headers || {})}});
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  return {ok: res.ok, status: res.status, body};
}

async function loadProducts() {
  const q = $('search').value.trim();
  const r = await api('/api/products' + (q ? '?q=' + encodeURIComponent(q) : ''));
  products = r.ok ? r.body : [];
  $('products').innerHTML = products.map(p => `
    <button class="product" data-sku="${esc(p.sku)}">
      <strong>${esc(p.name)}</strong><small>${esc(p.sku)} · ${esc(p.category)}</small><span>${money(p.priceCents)}</span>
    </button>`).join('') || '<p class="muted">No products (is pricing-service up?)</p>';
}

async function newCart() {
  const r = await api('/api/carts', {method: 'POST', body: JSON.stringify({
    storeId: $('store').value, terminalId: $('terminal').value, customerId: $('customer').value || null})});
  if (!r.ok) { return showPay('Could not open a cart: ' + JSON.stringify(r.body), true); }
  cart = r.body; quote = null; pendingKey = null;
  $('receipt').style.display = 'none'; $('payMsg').innerHTML = '';
  render();
}

async function addItem(sku) {
  if (!cart || cart.status !== 'OPEN') { await newCart(); }
  const r = await api(`/api/carts/${cart.id}/items`, {method: 'POST', body: JSON.stringify({sku, quantity: 1})});
  if (r.ok) { cart = r.body; await reprice(); } else { showPay(r.body?.message || 'Could not add item', true); }
}

async function setQty(sku, qty) {
  const r = await api(`/api/carts/${cart.id}/items/${encodeURIComponent(sku)}`, {method: 'PUT', body: JSON.stringify({quantity: qty})});
  if (r.ok) { cart = r.body; await reprice(); }
}

async function reprice() {
  quote = null;
  if (cart && cart.items.length) {
    const r = await api('/api/pricing/quote', {method: 'POST', body: JSON.stringify({storeId: cart.storeId, items: cart.items})});
    if (r.ok) { quote = r.body; }
    loadRecs();
  } else { $('recs').innerHTML = ''; }
  render();
}

async function loadRecs() {
  const params = cart.items.map(i => 'sku=' + encodeURIComponent(i.sku)).join('&');
  const r = await api('/api/recommendations?' + params + '&limit=3');
  $('recs').innerHTML = r.ok && r.body.length
    ? '<p class="muted" style="margin:8px 0 2px">Frequently bought together</p>' +
      r.body.map(x => `<button class="chip" data-sku="${esc(x.sku)}">+ ${esc(x.name)}</button>`).join('')
    : '';
}

function render() {
  $('cartInfo').textContent = cart ? `Cart ${cart.id.slice(0, 8)} · ${cart.status}` : 'No open cart';
  const lines = quote ? quote.lines : (cart?.items || []).map(i => ({sku: i.sku, name: i.sku, quantity: i.quantity, lineTotalCents: 0, discountCents: 0}));
  $('lines').innerHTML = lines.length ? lines.map(l => `
    <div class="row">
      <div><div>${esc(l.name)}</div><small class="muted">${esc(l.sku)}${l.discountCents ? ' · saved ' + money(l.discountCents) : ''}</small></div>
      <div class="qty">
        <button data-dec="${esc(l.sku)}" data-qty="${l.quantity}">−</button><span>${l.quantity}</span>
        <button data-inc="${esc(l.sku)}" data-qty="${l.quantity}">+</button>
        <span style="min-width:70px;text-align:right">${money(l.lineTotalCents)}</span>
      </div>
    </div>`).join('') : '<p class="muted">Basket is empty.</p>';
  $('totals').innerHTML = quote ? `
    <div class="row"><span>Subtotal</span><span>${money(quote.subtotalCents)}</span></div>
    ${quote.discountCents ? `<div class="row"><span>Savings</span><span>-${money(quote.discountCents)}</span></div>` : ''}
    <div class="row"><span>Tax</span><span>${money(quote.taxCents)}</span></div>
    <div class="row total"><span>Total</span><span>${money(quote.totalCents)}</span></div>
    ${quote.appliedPromotions.map(p => `<span class="chip">${esc(p)}</span>`).join('')}` : '';
  $('pay').disabled = !(cart && cart.status === 'OPEN' && quote);
}

function showPay(text, error = false) {
  $('payMsg').innerHTML = `<div class="msg ${error ? 'error' : ''}">${esc(text)}</div>`;
}

async function charge() {
  const method = $('method').value;
  if (cart.customerId !== ($('customer').value || null)) {
    const c = await api(`/api/carts/${cart.id}/customer`, {method: 'PUT', body: JSON.stringify({customerId: $('customer').value || null})});
    if (c.ok) { cart = c.body; }
  }
  pendingKey = pendingKey || crypto.randomUUID();
  const payment = method === 'CARD'
    ? {method, cardToken: $('token').value}
    : {method, tenderedCents: Math.round(parseFloat($('tendered').value || '0') * 100)};
  $('pay').disabled = true;
  showPay('Processing…');
  const r = await api('/api/checkout', {method: 'POST', headers: {'Idempotency-Key': pendingKey},
    body: JSON.stringify({cartId: cart.id, payment})});
  if (r.status === 201) {
    pendingKey = null; cart.status = 'CHECKED_OUT';
    const t = r.body;
    showPay(`Approved · ${t.id}` + (t.payment.changeCents ? ` · change ${money(t.payment.changeCents)}` : ''));
    render(); showReceipt(t.id); loadRecent();
  } else if (r.status === 402) {
    pendingKey = null; // declined is final for this attempt; the cart is unlocked for another tender
    showPay(`Declined: ${r.body.declineReason}. Try another tender.`, true);
    cart.status = 'OPEN'; render(); loadRecent();
  } else if (r.status === 503) {
    showPay('Payment status unknown — press Charge again to retry safely (same request id).', true);
    $('pay').disabled = false;
  } else {
    pendingKey = null;
    showPay(r.body?.message || 'Checkout failed', true); $('pay').disabled = false;
  }
}

async function showReceipt(txId, attempt = 0) {
  // receipts are produced asynchronously from the Kafka event, so poll briefly
  const r = await fetch(`/api/receipts/${txId}/text`);
  if (r.ok) { $('receipt').textContent = await r.text(); $('receipt').style.display = 'block'; }
  else if (attempt < 10) { setTimeout(() => showReceipt(txId, attempt + 1), 500); }
}

async function loadRecent() {
  const r = await api(`/api/transactions?storeId=${$('store').value}&limit=8`);
  $('recent').innerHTML = r.ok ? r.body.map(t => `
    <tr><td><code>${esc(t.id.slice(-8))}</code></td><td>${esc(t.status)}</td><td>${money(t.totalCents)}</td>
    <td style="text-align:right">${t.status === 'COMPLETED' ? `<button data-refund="${esc(t.id)}">Refund</button>` : ''}
    <button data-receipt="${esc(t.id)}">Receipt</button></td></tr>`).join('') : '';
}

async function refund(id) {
  if (!confirm(`Refund ${id} in full?`)) return;
  const r = await api(`/api/transactions/${id}/refund`, {method: 'POST', headers: {'Idempotency-Key': 'refund-' + id},
    body: JSON.stringify({reason: 'customer return'})});
  showPay(r.ok ? `Refunded ${id}` : (r.body?.message || 'Refund failed'), !r.ok);
  loadRecent(); setTimeout(() => showReceipt(id), 800);
}

async function ask(e) {
  e.preventDefault();
  const q = $('question').value.trim();
  if (!q) return;
  $('question').value = '';
  $('chat').insertAdjacentHTML('beforeend', `<div class="bubble me">${esc(q)}</div>`);
  const pending = document.createElement('div');
  pending.className = 'bubble bot muted'; pending.textContent = 'Thinking…';
  $('chat').appendChild(pending); $('chat').scrollTop = $('chat').scrollHeight;
  const r = await api('/api/assistant/chat', {method: 'POST', body: JSON.stringify({conversationId, storeId: $('store').value, message: q})});
  pending.classList.remove('muted');
  if (r.ok) {
    conversationId = r.body.conversationId;
    const meta = [...r.body.toolsUsed.map(t => '⚙ ' + t), ...r.body.sources.map(s => '📄 ' + s)];
    pending.innerHTML = esc(r.body.answer) + (meta.length ? '<div>' + meta.map(m => `<span class="chip">${esc(m)}</span>`).join('') + '</div>' : '');
  } else { pending.textContent = 'Assistant unavailable.'; }
  $('chat').scrollTop = $('chat').scrollHeight;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.sku) addItem(t.dataset.sku);
  else if (t.dataset.inc) setQty(t.dataset.inc, +t.dataset.qty + 1);
  else if (t.dataset.dec) setQty(t.dataset.dec, +t.dataset.qty - 1);
  else if (t.dataset.refund) refund(t.dataset.refund);
  else if (t.dataset.receipt) showReceipt(t.dataset.receipt);
});
$('newCart').onclick = newCart;
$('pay').onclick = charge;
$('ask').onsubmit = ask;
$('store').onchange = () => { cart = null; quote = null; render(); loadRecent(); };
$('method').onchange = () => {
  const cash = $('method').value === 'CASH';
  $('token').style.display = cash ? 'none' : ''; $('tendered').style.display = cash ? '' : 'none';
};
let searchTimer;
$('search').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadProducts, 200); };
loadProducts(); loadRecent(); render();
</script>
</body>
</html>
